# --- SERVER CONFIGURATION ---
# The port your app will run on (Default is 8080)
server.port=8081

# --- DATABASE CONFIGURATION (Example using H2 In-Memory DB) ---
# If using MySQL/Postgres, you would change these values
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=postgres
spring.datasource.password=your_password

# This tells Hibernate to automatically create/update your database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# --- HIBERNATE / JPA CONFIGURATION ---
# 'update' automatically creates/updates database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
# Prints the SQL queries in the console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enables the H2 web console to view your database in the browser
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
