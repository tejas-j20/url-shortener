# --- SERVER CONFIGURATION ---
# The port your app will run on (Default is 8080)
server.port=8080

# --- DATABASE CONFIGURATION ---
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=postgres
spring.datasource.password=root

# This tells Hibernate to automatically create/update your database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# --- HIBERNATE / JPA CONFIGURATION ---
# 'update' automatically creates/updates database tables based on your Java models
spring.jpa.hibernate.ddl-auto=update
# Prints the SQL queries in the console (great for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=1h

app.base-url=http://localhost:8080

